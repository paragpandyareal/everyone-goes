services:
  - type: web
    name: everyone-goes
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Postgres connection string (Render Postgres, Neon or similar). Without it the app falls back to an in-process database that resets on restart.
      - { key: DATABASE_URL, sync: false }
      - { key: TRIPS_CLIENT_ID, sync: false }
      - { key: TRIPS_CLIENT_SECRET, sync: false }
      - { key: TRIPS_EMAIL, sync: false }
      - { key: TRIPS_WEBHOOK_ID, sync: false }
      - { key: COVERFUND_CLIENT_ID, sync: false }
      - { key: COVERFUND_CLIENT_SECRET, sync: false }
      - { key: COVERFUND_EMAIL, sync: false }
      - { key: COVERFUND_WEBHOOK_ID, sync: false }
      - { key: PARENT_EMAILS, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ANTHROPIC_MODEL, value: claude-opus-5-5 }
      - { key: AGENT_MODE, value: live }
      - { key: AGENT_RUNS_PER_HOUR, value: "30" }
      - { key: LINK_TABLE_KEY, generateValue: true }
      - { key: APPROVAL_SIGNING_KEY, generateValue: true }
      - { key: ADMIN_TOKEN, generateValue: true }
      - { key: APP_BASE_URL, sync: false }
      # Public judge demo: role pages open, protected by caps and rate limits. Set to 0 and use STAFF_PASSCODE for a real school.
      - { key: DEMO_MODE, value: "1" }
      - { key: STAFF_PASSCODE, generateValue: true }
      # Sandbox-only test logins shown on the hub, JSON list of {role,email,password}
      - { key: DEMO_LOGINS, sync: false }
      - { key: AGENT_RUNS_PER_DAY, value: "250" }
      - { key: GLOBAL_COVERS_PER_DAY, value: "30" }
